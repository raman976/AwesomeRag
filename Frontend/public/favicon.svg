<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)"/>
  
  <!-- Database symbol (retrieval) -->
  <ellipse cx="24" cy="20" rx="8" ry="4" fill="white" opacity="0.3"/>
  <rect x="16" y="20" width="16" height="6" fill="white" opacity="0.2"/>
  <ellipse cx="24" cy="26" rx="8" ry="4" fill="white" opacity="0.25"/>
  
  <!-- Magnifying glass (search/retrieval focus) -->
  <circle cx="40" cy="38" r="9" fill="none" stroke="white" stroke-width="2.5"/>
  <line x1="48" y1="46" x2="54" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Plus symbol (augmented/enhancement) -->
  <line x1="32" y1="28" x2="32" y2="36" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="28" y1="32" x2="36" y2="32" stroke="white" stroke-width="1.5" opacity="0.8"/>
</svg>